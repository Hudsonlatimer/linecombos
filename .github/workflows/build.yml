name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # GitHub drops many scheduled runs, so ask often; the gap check below keeps deploys under Vercel's 100 a day.
    - cron: "*/6 15-23,0-6 * * *"
    - cron: "*/20 7-14 * * *"

concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Skip scheduled runs that come right after a deploy
        id: gap
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            built=$(curl -s "https://linecombos.vercel.app/version.json?t=$RANDOM" | sed -n 's/.*"builtAt":"\([^"]*\)".*/\1/p')
            if [ -n "$built" ]; then
              age=$(( $(date +%s) - $(date -d "$built" +%s) ))
              echo "last build $age seconds ago"
              if [ "$age" -lt 660 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
            fi
          fi
      - uses: actions/checkout@v4
        if: steps.gap.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.gap.outputs.skip != 'true'
        with:
          node-version: 22
      - name: Restore API cache
        if: steps.gap.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: .cache
          key: nhl-cache-${{ github.run_id }}
          restore-keys: nhl-cache-
      - run: npm test
        if: steps.gap.outputs.skip != 'true'
      - name: Build site
        if: steps.gap.outputs.skip != 'true'
        run: npm run build
        env:
          LIVE_API: ${{ secrets.LIVE_API }}
          X_FEED_URL: ${{ secrets.X_FEED_URL }}
      - name: Save collected posts
        if: steps.gap.outputs.skip != 'true'
        run: |
          git config user.name "linecombos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/posts.json
          git diff --cached --quiet || git commit -m "Update posts [skip ci]"
          git push || true
      - name: Deploy to Vercel
        if: steps.gap.outputs.skip != 'true'
        working-directory: dist
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_YqqrcqI3ENUOa7xZ5hwRiaJv
          VERCEL_PROJECT_ID: prj_ndI8BCCXzsyuUstFGApKdcPaSZLP
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "::error::The VERCEL_TOKEN secret is empty. Add it under Settings > Secrets and variables > Actions > Repository secrets, named exactly VERCEL_TOKEN."; exit 1; fi
          printf '.env*\n.gitignore\n_headers\n' > .vercelignore
          npx --yes vercel@62 deploy --prod --yes --archive=tgz --token "$VERCEL_TOKEN"
